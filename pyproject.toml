[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-strategy"
version = "1.0.0"
description = "量化策略 — ML 多因子选股与链主事件驱动评分系统"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"

dependencies = [
    # 数据处理
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",       # parquet I/O

    # 机器学习
    "xgboost>=2.0",
    "scikit-learn>=1.3",

    # 数据获取
    "requests>=2.28",
    "akshare>=1.14",
    "thsdk>=1.7",          # 同花顺 SDK

    # WebSocket (SuperMind / Jupyter Kernel)
    "aiohttp>=3.9",
    "websocket-client>=1.6",
    "websockets>=12.0",
    "httpx>=0.26",

    # 实用工具
    "joblib>=1.3",
    "tqdm>=4.64",
    "pyyaml>=6.0",
    "click>=8.1",
    "typer>=0.9",

    # 调度 / 重试
    "tenacity>=8.2",
    "apscheduler>=3.10",

    # Web 框架（策略管理后端）
    "fastapi>=0.110",
    "uvicorn>=0.29",

    # 数据验证（规划中）
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "mypy>=1.8",
    "ruff>=0.3",
    "pre-commit>=3.6",
]

notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "lightgbm>=4.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "backtest*", "engine*", "strategies*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长度由 formatter 处理

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
